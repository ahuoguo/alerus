name: Bump Verus

# Dependabot can't track Verus (it ships as GitHub release zips), so this job
# plays that role: it checks for a new stable Verus release and opens a PR that
# updates the Verus, Rust and vstd pins together. The PR then runs the normal
# "Verify with Verus" workflow against the new toolchain.

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays; Verus cuts a stable release each weekend
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update pins to the latest Verus release
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/bump-verus.sh >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.VERUS_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          branch: verus-bump
          delete-branch: true
          commit-message: "Bump Verus to ${{ steps.bump.outputs.version }}"
          title: "Bump Verus to ${{ steps.bump.outputs.version }}"
          body: |
            Updates to the latest stable Verus release:

            - Verus: [`${{ steps.bump.outputs.version }}`](https://github.com/verus-lang/verus/releases/tag/release%2F${{ steps.bump.outputs.version }})
            - Rust toolchain: `${{ steps.bump.outputs.rust }}`
            - vstd: `${{ steps.bump.outputs.vstd }}`

            Generated by `.github/workflows/verus-bump.yml`.
          labels: dependencies
