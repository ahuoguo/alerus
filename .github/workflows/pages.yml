name: Verusdoc

# Build the Verusdoc API documentation for the `ub` crate and publish it to
# GitHub Pages. The rendered site lives at the repository's Pages URL.
#
# Requires Pages to be enabled with "Source: GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep these in sync with the Verus version pinned in veris/Cargo.toml and
  # .github/workflows/main.yml.
  VERUS_VER: 0.2026.09.13.671956e
  VERUS_TAG: release/0.2026.09.13.671956e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Download Verus
        run: |
          wget -q "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VER}/verus-${VERUS_VER}-x86-linux.zip"
          unzip -q "verus-${VERUS_VER}-x86-linux.zip"

      - name: Build the verusdoc post-processor
        run: |
          # The Verus release ships the builtin/vstd rlibs but not the verusdoc
          # HTML post-processor, so install it from the matching source tag.
          # `cargo install --git` builds just this crate inside the Verus
          # workspace (so `workspace = true` deps resolve) and `--locked` uses
          # Verus's own Cargo.lock.
          cargo +1.98.1 install --locked \
            --git https://github.com/verus-lang/verus --tag "$VERUS_TAG" \
            --root "$RUNNER_TEMP/verusdoc" verusdoc

      - name: Generate verusdoc
        env:
          VERUS_BIN_DIR: ${{ github.workspace }}/verus-x86-linux
          VERUSDOC_BIN: ${{ runner.temp }}/verusdoc/bin/verusdoc
        run: |
          export RUSTDOC="$(rustup which --toolchain 1.98.1 rustdoc)"
          ./gen-verusdoc.sh
          # Redirect the site root to the crate landing page.
          printf '<meta http-equiv="refresh" content="0; url=alerus/index.html">\n' > doc/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
