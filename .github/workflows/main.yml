name: Verify with Verus

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Keep these in sync with the vstd version pinned in alerus/Cargo.toml and
  # .github/workflows/pages.yml.
  VERUS_VER: 0.2026.09.13.671956e
  RUST_VER: 1.98.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VER }}
        # rustup is preinstalled on GitHub-hosted runners.
        run: |
          rustup toolchain install ${{ env.RUST_VER }} --profile minimal
          rustup default ${{ env.RUST_VER }}

      - name: Download Verus
        run: |
          wget -q "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VER}/verus-${VERUS_VER}-x86-linux.zip"
          unzip -q "verus-${VERUS_VER}-x86-linux.zip"

      - name: Add Verus to PATH
        run: echo "$(pwd)/verus-x86-linux/" >> $GITHUB_PATH

      - name: cargo verus verify -p alerus
        working-directory: .
        run: cargo verus verify -p alerus
