version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: vstd
      # Pinned to whatever dashu opendp depends on (see random/Cargo.toml);
      # bump it by hand together with opendp.
      - dependency-name: dashu
    groups:
      cargo:
        patterns: ["*"]
